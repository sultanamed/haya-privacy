name: Verify companion installation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: windows-2022
            target: windows-x64
          - runner: macos-14
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download review package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: gh release download ses-motoru-v0.12.23 --dir assets --pattern "Haya-0.12.23-${TARGET}.zip" --pattern "Haya-0.12.23-${TARGET}.sha256"
      - name: Test installation, native startup, real audio, and removal
        shell: bash
        run: python tools/verify_companion.py --assets assets --report reports/${{ matrix.target }}.json
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: companion-${{ matrix.target }}
          path: reports/
